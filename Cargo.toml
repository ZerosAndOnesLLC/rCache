[package]
name = "rcache"
version = "0.11.9"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "fs"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
crc16 = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json = "1"
tokio-rustls = "0.26"
rustls = "0.23"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
lz4_flex = "0.14"
sha2 = "0.11"
sha1 = "0.11"

[dev-dependencies]
redis = { version = "1.8", features = ["tokio-comp"] }
